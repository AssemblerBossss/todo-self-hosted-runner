[tool.ruff]
line-length = 120
exclude = [".venv", "migrations"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = [
  ".", "app",
]
markers = [
    "integration: marks tests as integration tests (run with -m integration)",
]
asyncio_mode="auto"
asyncio_default_fixture_loop_scope="session"